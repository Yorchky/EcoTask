<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTask</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div class="logo">
                <span>🌱</span>
                <strong>EcoTask</strong>
            </div>

            <button class="btn-nueva" onclick="mostrarFormulario()">
                + Nueva tarea
            </button>
        </header>


        <main class="contenido">

            <section class="seccion">

                <div class="titulo-seccion">
                    <h2>Mis tareas</h2>
                    <span id="contador">0 tareas</span>
                </div>

                <div id="tareas" class="tareas"></div>

            </section>


            <section class="seccion reconocimientos">

                <h2>💚 Reconocimientos</h2>

                <div class="reconocimiento">
                    <strong>Jorge</strong>
                    <p>Excelente trabajo con el backend.</p>
                </div>

                <div class="reconocimiento">
                    <strong>Criss</strong>
                    <p>Gran trabajo en el diseño.</p>
                </div>

                <div class="reconocimiento">
                    <strong>Veto</strong>
                    <p>Gracias por apoyar con la API.</p>
                </div>

                <div class="reconocimiento">
                    <strong>Saul</strong>
                    <p>Excelente aporte al prototipo.</p>
                </div>

            </section>

        </main>


        <!-- FORMULARIO -->
        <div id="modal" class="modal oculto">

            <div class="modal-contenido">

                <h2>Nueva tarea</h2>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Nombre de la tarea"
                >

                <select id="estado">

                    <option value="Pendiente">
                        Pendiente
                    </option>

                    <option value="En progreso">
                        En progreso
                    </option>

                    <option value="Completada">
                        Completada
                    </option>

                </select>

                <div class="acciones">

                    <button
                        class="btn-guardar"
                        onclick="crearTarea()">
                        Guardar
                    </button>

                    <button
                        class="btn-cancelar"
                        onclick="cerrarFormulario()">
                        Cancelar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="./app.js"></script>

</body>

</html>
